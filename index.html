<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Láminas Lotería</title>
</head>

<body>

  <h1>Generador de Láminas 🎴</h1>

  <h2>Configuración</h2>

  <label>Número de láminas:</label>
  <input type="number" id="cantidad" value="1"><br><br>

  <label>Ancho de lámina (cm):</label>
  <input type="number" id="ancho" value="30"><br><br>

  <label>Alto de lámina (cm):</label>
  <input type="number" id="alto" value="20"><br><br>

  <label>Orientación de hoja:</label>
  <select id="orientacion">
    <option value="portrait">Vertical</option>
    <option value="landscape">Horizontal</option>
  </select><br><br>

  <label>Distribución de cartas:</label>
  <select id="grid">
    <option value="9x6">9 x 6</option>
    <option value="6x9">6 x 9</option>
  </select><br><br>

  <button id="btnPDF">Generar PDF</button>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="plantilla.js"></script>

</body>
</html>
